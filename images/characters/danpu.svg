<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- シャーシフレーム -->
  <rect x="2" y="24" width="32" height="4" rx="1.5" fill="#292F33"/>

  <!-- 車輪（大きなタイヤ3つ） -->
  <circle cx="6" cy="27" r="4.5" fill="#292F33"/>
  <circle cx="6" cy="27" r="2" fill="#CCD6DD"/>
  <circle cx="17" cy="27" r="4.5" fill="#292F33"/>
  <circle cx="17" cy="27" r="2" fill="#CCD6DD"/>
  <circle cx="28" cy="27" r="4.5" fill="#292F33"/>
  <circle cx="28" cy="27" r="2" fill="#CCD6DD"/>

  <!-- 運転席キャビン（前方・右側・黄色） -->
  <path d="M22 13 H28 C30 13 32 15 32 17 L32 25 H22 Z" fill="#FFCC4D"/>
  <!-- 窓ガラス（水色） -->
  <path d="M24 15 H28 C29.5 15 30.5 16 30.5 17.5 L30.5 20 H24 Z" fill="#55ACEE"/>
  <!-- ヘッドライト -->
  <circle cx="31.5" cy="22" r="1" fill="#FFAC33"/>
  <!-- バンパー -->
  <rect x="30" y="23" width="3" height="3" rx="0.5" fill="#66757F"/>

  <!-- ダンプカーの頑丈な荷台（後部・斜めに上がったダンプベッド形状） -->
  <!-- 左が高く傾斜したダンプ特有の荷台ボックス -->
  <path d="M2 9 L20 12 L19 24 H2 Z" fill="#FB8500"/>
  <!-- 荷台の補強リブ（ストライプライン） -->
  <line x1="7" y1="10" x2="7" y2="24" stroke="#D97706" stroke-width="1.2"/>
  <line x1="13" y1="11" x2="13" y2="24" stroke="#D97706" stroke-width="1.2"/>

  <!-- 荷台に乗っている土砂・小石（山盛り） -->
  <path d="M3 9 Q10 5 19 12 Z" fill="#8D6E63"/>
  <circle cx="8" cy="7.5" r="1.2" fill="#6D4C41"/>
  <circle cx="13" cy="8.5" r="1.5" fill="#5D4037"/>

  <!-- キャブと荷台の間の油圧シリンダー -->
  <rect x="19.5" y="16" width="2" height="8" rx="0.5" fill="#99AAB5"/>
</svg>