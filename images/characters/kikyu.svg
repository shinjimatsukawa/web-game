<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- 吊り下げロープ (リギング) -->
  <line x1="13.5" y1="24.5" x2="15" y2="28.5" stroke="#66757F" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16.5" y1="24.8" x2="16.8" y2="28.5" stroke="#66757F" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19.5" y1="24.8" x2="19.2" y2="28.5" stroke="#66757F" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22.5" y1="24.5" x2="21" y2="28.5" stroke="#66757F" stroke-width="0.8" stroke-linecap="round"/>

  <!-- バスケット（ゴンドラ） -->
  <rect x="13.5" y="28.5" width="9" height="5.5" rx="1.2" fill="#C1694F"/>
  <!-- バスケットのリム（縁） -->
  <rect x="13" y="28" width="10" height="1.2" rx="0.6" fill="#8B5E3C"/>
  <!-- バスケットの編み目ライン -->
  <line x1="14.5" y1="30.5" x2="21.5" y2="30.5" stroke="#8B5E3C" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="14.5" y1="32.2" x2="21.5" y2="32.2" stroke="#8B5E3C" stroke-width="0.7" stroke-linecap="round"/>

  <!-- バーナーの炎（アクセント） -->
  <path fill="#FFAC33" d="M18 25.8c-.7 0-1.2-.7-1.2-1.4 0-.8 1.2-1.8 1.2-1.8s1.2 1 1.2 1.8c0 .7-.5 1.4-1.2 1.4z"/>
  <path fill="#DD2E44" d="M18 25.8c-.4 0-.6-.4-.6-.7 0-.5.6-.9.6-.9s.6.4.6.9c0 .3-.2.7-.6.7z"/>

  <!-- 気球バルーン（エンベロープ） -->
  <g>
    <!-- ベース・外側ストライプ (スカイブルー #55ACEE) -->
    <path fill="#55ACEE" d="M18 1C10.27 1 4 7.27 4 15c0 4.2 2.15 7.8 5.5 10l3.5.2h10l3.5-.2c3.35-2.2 5.5-5.8 5.5-10C32 7.27 25.73 1 18 1z"/>

    <!-- 中間ストライプ (イエロー #FFCC4D) -->
    <path fill="#FFCC4D" d="M18 1c-5.3 0-9.8 4.8-9.8 14 0 4.5 2.2 8.3 4.8 10.2h10c2.6-1.9 4.8-5.7 4.8-10.2 0-9.2-4.5-14-9.8-14z"/>

    <!-- 中央ストライプ (ビビッドレッド #DD2E44) -->
    <path fill="#DD2E44" d="M18 1c-2.5 0-4.6 4.8-4.6 14 0 4.5 1.1 8.3 2.4 10.2h4.4c1.3-1.9 2.4-5.7 2.4-10.2 0-9.2-2.1-14-4.6-14z"/>

    <!-- 左上のハイライト（Twemoji特有の控えめな光沢感） -->
    <path fill="#FFF" opacity="0.25" d="M18 2c-6.8 0-12 5.2-12 12 0 1.6.4 3.2 1 4.5-.4-1.4-.6-2.9-.6-4.5C6.4 8 11.2 3.2 17.5 3.1.2 0 .3 0 .5-.1z"/>

    <!-- バルーン下部のカラー（リム #A0041E） -->
    <rect x="12.5" y="24" width="11" height="1.6" rx="0.8" fill="#A0041E"/>
  </g>
</svg>
