<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 気球本体のカラフルなストライプグラデーション -->
    <radialGradient id="balloonGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- 雲のデコレーション背景 -->
  <path d="M12 72 Q16 66 22 68 Q28 64 32 70 Q36 74 30 76 Q20 77 12 72 Z" fill="#e2f1ff" opacity="0.8"/>
  <path d="M70 30 Q74 24 80 26 Q86 23 90 28 Q93 33 87 35 Q78 36 70 30 Z" fill="#e2f1ff" opacity="0.8"/>

  <!-- バスケットとロープ -->
  <!-- 吊り下げロープ -->
  <line x1="38" y1="71" x2="43" y2="82" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="71" x2="57" y2="82" stroke="#8d6e63" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="72" x2="46" y2="82" stroke="#a1887f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="72" x2="54" y2="82" stroke="#a1887f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- バスケット本体（藤かご） -->
  <rect x="42" y="82" width="16" height="13" rx="3" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <line x1="42" y1="87" x2="58" y2="87" stroke="#a1887f" stroke-width="1.5"/>
  <line x1="42" y1="91" x2="58" y2="91" stroke="#a1887f" stroke-width="1.5"/>
  <line x1="47" y1="82" x2="47" y2="95" stroke="#a1887f" stroke-width="1.5"/>
  <line x1="53" y1="82" x2="53" y2="95" stroke="#a1887f" stroke-width="1.5"/>
  <!-- バスケットの縁 -->
  <rect x="40.5" y="80.5" width="19" height="3" rx="1.5" fill="#8d6e63"/>

  <!-- バーナーの火（小さなアクセント） -->
  <path d="M48 76 Q50 72 52 76 Q50 74 48 76 Z" fill="#ff7043"/>

  <!-- 気球（エンベロープ）の輪郭クリップ -->
  <g>
    <!-- 気球の形状クリップパス -->
    <clipPath id="balloonClip">
      <path d="M50 72 C42 72 36 67 33 58 C26 48 24 38 27 26 C31 11 40 6 50 6 C60 6 69 11 73 26 C76 38 74 48 67 58 C64 67 58 72 50 72 Z"/>
    </clipPath>

    <!-- カラフルな縦縞セグメント -->
    <g clip-path="url(#balloonClip)">
      <!-- 左端: ターコイズ/スカイブルー -->
      <path d="M22 6 L35 6 L36 72 L22 72 Z" fill="#29b6f6"/>
      <!-- 左中: イエロー -->
      <path d="M35 6 L44 6 L43 72 L36 72 Z" fill="#ffca28"/>
      <!-- 中央: ビビッドレッド/マゼンタ -->
      <path d="M44 6 L56 6 L57 72 L43 72 Z" fill="#ff4081"/>
      <!-- 右中: ライムグリーン -->
      <path d="M56 6 L65 6 L64 72 L57 72 Z" fill="#9ccc65"/>
      <!-- 右端: オレンジ -->
      <path d="M65 6 L78 6 L78 72 L64 72 Z" fill="#ff7043"/>

      <!-- 気球の陰影・立体感グラデーション -->
      <rect x="20" y="5" width="60" height="70" fill="url(#balloonGlow)"/>

      <!-- 横の飾りバンド（スカラップ模様） -->
      <path d="M20 40 Q28 46 36 41 Q44 47 52 41 Q60 47 68 41 Q76 46 80 40 L80 47 Q76 53 68 48 Q60 54 52 48 Q44 54 36 48 Q28 53 20 47 Z" fill="#ffffff" opacity="0.85"/>
      
      <!-- ハイライト光沢 -->
      <ellipse cx="37" cy="22" rx="7" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-25 37 22)"/>
    </g>

    <!-- 気球のアウトライン -->
    <path d="M50 72 C42 72 36 67 33 58 C26 48 24 38 27 26 C31 11 40 6 50 6 C60 6 69 11 73 26 C76 38 74 48 67 58 C64 67 58 72 50 72 Z" 
          fill="none" stroke="#e91e63" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- 気球下部のリングカラー -->
  <rect x="42" y="70" width="16" height="3" rx="1.5" fill="#c2185b"/>
</svg>
