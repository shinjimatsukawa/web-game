<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <!-- トラックのキャビン（爽やかなスカイブルー） -->
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- 荷台（ホワイトコンテナ） -->
    <linearGradient id="cargoBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- 地面 -->
  <line x1="2" y1="41" x2="42" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 車輪・タイヤ -->
  <!-- 前輪 -->
  <circle cx="34" cy="36" r="4.5" fill="#1e293b"/>
  <circle cx="34" cy="36" r="2.2" fill="#cbd5e1"/>
  <circle cx="34" cy="36" r="0.8" fill="#475569"/>
  <!-- 後輪 -->
  <circle cx="12" cy="36" r="4.5" fill="#1e293b"/>
  <circle cx="12" cy="36" r="2.2" fill="#cbd5e1"/>
  <circle cx="12" cy="36" r="0.8" fill="#475569"/>

  <!-- シャーシフレーム -->
  <rect x="8" y="32" width="28" height="3" rx="1" fill="#334155"/>

  <!-- 荷台コンテナ（大きな白い荷物ボックス） -->
  <rect x="4" y="14" width="22" height="18" rx="2" fill="url(#cargoBox)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 荷台のライン -->
  <line x1="15" y1="14" x2="15" y2="32" stroke="#e2e8f0" stroke-width="1"/>
  <!-- 荷物のシンボル（段ボールマーク） -->
  <rect x="11.5" y="20" width="7" height="6" rx="1" fill="#f59e0b" stroke="#d97706" stroke-width="0.6"/>
  <line x1="11.5" y1="23" x2="18.5" y2="23" stroke="#b45309" stroke-width="0.6"/>

  <!-- 運転席キャビン（前方・右向き） -->
  <path d="M26 18 H35 Q39 18 39 23 L39 33 H26 Z" fill="url(#truckCab)" stroke="#0369a1" stroke-width="0.8"/>
  <!-- 窓ガラス -->
  <path d="M28 20 H35 Q37.5 20 37.5 24 L37.5 27 H28 Z" fill="#e0f2fe"/>
  <!-- ライト & バンパー -->
  <rect x="38" y="28" width="2" height="4" rx="0.5" fill="#64748b"/>
  <circle cx="38" cy="27" r="1.2" fill="#facc15"/>
</svg>