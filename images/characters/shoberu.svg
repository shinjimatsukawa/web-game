<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <style>
      .exc-line { stroke: #1e293b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 地面 -->
  <line x1="2" y1="41" x2="42" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- キャタピラー（クローラー軌道・履帯） -->
  <rect x="4" y="32" width="24" height="7" rx="3.5" fill="#334155" class="exc-line"/>
  <!-- クローラーホイール（車輪4つ） -->
  <circle cx="7.5" cy="35.5" r="2.2" fill="#94a3b8"/>
  <circle cx="13" cy="35.5" r="2.2" fill="#94a3b8"/>
  <circle cx="18.5" cy="35.5" r="2.2" fill="#94a3b8"/>
  <circle cx="24.5" cy="35.5" r="2.2" fill="#94a3b8"/>
  <!-- キャタピラ中央のフレームプレート -->
  <rect x="6" y="34.5" width="20" height="2" fill="#475569"/>

  <!-- 旋回台・車体本体（キャビン・黄色） -->
  <path d="M 6 22 C 6 20 8 18 11 18 L 22 18 C 24 18 26 20 26 22 L 26 31 L 6 31 Z" 
        fill="#facc15" class="exc-line"/>

  <!-- キャビンの大きな窓ガラス（水色） -->
  <path d="M 17 20 L 24 20 L 24 27 L 17 27 Z" fill="#7dd3fc" class="exc-line"/>

  <!-- 車体後部のカウンターウェイト（グレー） -->
  <path d="M 6 23 C 6 21 7 20 9 20 L 10 20 L 10 31 L 6 31 Z" fill="#64748b"/>

  <!-- ブーム（第1アーム・斜め上に伸びる黄色いアーム） -->
  <path d="M 23 27 L 33 13 L 36 15 L 25 30 Z" fill="#facc15" class="exc-line"/>
  <circle cx="24" cy="28.5" r="1.8" fill="#475569" class="exc-line"/> <!-- 根本関節 -->

  <!-- 油圧シリンダー（シルバー） -->
  <line x1="22" y1="23" x2="31" y2="18" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="23" x2="27" y2="20" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- アーム（第2アーム・斜め下に曲がる） -->
  <path d="M 33 13 L 38 24 L 35 25 L 31 15 Z" fill="#eab308" class="exc-line"/>
  <circle cx="33.5" cy="14" r="1.8" fill="#475569" class="exc-line"/> <!-- 中間関節 -->

  <!-- アーム先端の油圧シリンダー -->
  <line x1="31" y1="12" x2="37" y2="18" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- バケット関節 -->
  <circle cx="37" cy="24.5" r="1.6" fill="#475569" class="exc-line"/>

  <!-- ショベルバケット（土を掘るシャベル・爪付き・ダークグレー） -->
  <path d="M 36 24 C 39 23 42 27 41 31 L 35 31 C 34 28 35 25 36 24 Z" 
        fill="#475569" class="exc-line"/>
  <!-- バケットの爪（ギザギザの刃） -->
  <polygon points="41,31 43,33 40,33" fill="#334155"/>
  <polygon points="38,31 39.5,33 37,33" fill="#334155"/>
  <polygon points="35,31 36,33 34,33" fill="#334155"/>

  <!-- バケットですくった土砂・土煙（ホリホリ！） -->
  <path d="M 37 27 Q 41 28 39 31 Z" fill="#92400e"/>
  <circle cx="34" cy="35" r="1.5" fill="#b45309"/>
  <circle cx="38" cy="36" r="2" fill="#78350f"/>
  <circle cx="41" cy="35" r="1.2" fill="#92400e"/>
</svg>
