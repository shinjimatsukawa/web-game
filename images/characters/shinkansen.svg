<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <!-- 地面の影（車体下の影） -->
  <path d="M 14 51 L 95 31 L 95 29 L 43 47 C 32 51 20 52 14 51 Z" fill="#292F33" opacity="0.6"/>

  <!-- 車体下部の青いスカート（排障器・ブルー帯）: #1D4ED8 -->
  <path d="M 7 42 C 6 45 8 50 16 53 C 24 56 36 54 44 49 L 95 28 L 94 25 L 43 45 C 33 49 18 51 10 47 C 7 45 6 43 7 42 Z" 
        fill="#1d4ed8"/>
  <!-- スカートのダークトーン底面（立体感） -->
  <path d="M 10 48 C 18 52 33 51 44 47 L 95 27 L 95 28.5 L 44 49 C 36 54 24 56 16 53 C 12 51 9 49 10 48 Z" 
        fill="#1e40af"/>

  <!-- 新幹線車体のベース（陰影・サイドパネル）: #E1E8ED -->
  <path d="M 6 41 C 5 36 8 30 19 25 C 27 21 34 16 43 16 C 53 16 75 25 96 27 L 95 28 L 43 45 C 33 49 18 51 10 47 C 7 45 6 43 6 41 Z" 
        fill="#E1E8ED"/>

  <!-- 屋根・上面のホワイトパネル（手前〜屋根の明るい白）: #FFFFFF -->
  <path d="M 6 40 C 5.2 35.5 8 30 18.5 25 C 26 21 33 16 43 16 C 52 16 74 24.5 95 26.5 L 94 25.5 C 73 23.5 52 15 42 15 C 32 15 25 20 17 24 C 7 29 4.5 35 5 40 Z" 
        fill="#FFFFFF"/>

  <!-- 車体側面のハイライトパネル（ホワイト） -->
  <path d="M 8 38 C 12 34 22 28 35 24 C 50 20 70 23 94 26 L 94 27 C 70 24 50 21 35 25 C 22 29 12 35 8 38 Z" 
        fill="#FFFFFF" opacity="0.9"/>

  <!-- 黄色のストライプ帯（青帯のすぐ上）: #FFCC4D -->
  <path d="M 7.2 42.2 C 15 47 30 46 43 42 L 95 25 L 95 26.5 L 43 43.5 C 30 47.5 15 48.5 7.2 43.8 Z" 
        fill="#FFCC4D"/>

  <!-- ノーズ先端の丸みキャップ（ホワイト・陰影 #CCD6DD） -->
  <path d="M 8 33 C 6 36 6 40 8 42.5 C 13 45.5 22 44.5 24 39 C 25 34 16 31 8 33 Z" 
        fill="#FFFFFF"/>
  <path d="M 8 34 C 6.5 36.5 6.5 39.5 8 41.5 C 10 40 12 37 12 35 C 10 34.5 9 34.2 8 34 Z" 
        fill="#CCD6DD" opacity="0.5"/>

  <!-- 楕円形の黄色いヘッドライト: #FFCC4D + 芯 #FFF9C4 -->
  <ellipse cx="33" cy="35" rx="4.2" ry="3.2" fill="#FFCC4D"/>
  <ellipse cx="33" cy="35" rx="2.5" ry="1.8" fill="#FFF9C4"/>

  <!-- 運転席フロントガラス（流線型新幹線らしいシャープなキャノピー） -->
  <path d="M 20 26 C 26 21 35 21 44 22 C 45 23 43 27 39 28 C 30 29 23 28.5 20 26 Z" fill="#1e293b"/>
  <path d="M 21.5 25.8 C 26.5 21.8 34.5 21.8 42.5 22.8 C 42.5 24 41 26.5 38 27.2 C 30 28 24 27.5 21.5 25.8 Z" fill="#55ACEE"/>
  <!-- 光沢反射ライン -->
  <path d="M 24 24 Q 31 22.5 38 23.5" stroke="#ffffff" stroke-width="1.0" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- 乗務員室ドア（自然な境界ライン＆小さな窓） -->
  <line x1="47" y1="20.5" x2="44" y2="37.5" stroke="#CCD6DD" stroke-width="1.0" stroke-linecap="round"/>
  <rect x="48" y="23" width="3.2" height="4.8" rx="0.8" fill="#55ACEE"/>

  <!-- 客席の自然な窓並び（小さめで整然とした新幹線らしい窓） -->
  <!-- 窓1 (手前) -->
  <rect x="54" y="23.5" width="4.8" height="5.5" rx="1.0" fill="#55ACEE"/>
  <rect x="54.5" y="24" width="3.8" height="1.2" rx="0.5" fill="#ffffff" opacity="0.6"/>

  <!-- 窓2 -->
  <rect x="61" y="24.2" width="4.5" height="5.0" rx="1.0" fill="#55ACEE"/>
  <rect x="61.5" y="24.6" width="3.5" height="1.1" rx="0.5" fill="#ffffff" opacity="0.6"/>

  <!-- 窓3 -->
  <rect x="67.5" y="24.8" width="4.2" height="4.5" rx="0.9" fill="#55ACEE"/>
  <rect x="68" y="25.2" width="3.2" height="1.0" rx="0.5" fill="#ffffff" opacity="0.6"/>

  <!-- 窓4 -->
  <rect x="73.5" y="25.4" width="3.8" height="4.0" rx="0.8" fill="#55ACEE"/>
  <rect x="74" y="25.7" width="2.8" height="0.9" rx="0.4" fill="#ffffff" opacity="0.6"/>

  <!-- 窓5 -->
  <rect x="79" y="25.9" width="3.5" height="3.6" rx="0.7" fill="#55ACEE"/>

  <!-- 窓6 (奥) -->
  <rect x="84.2" y="26.4" width="3.0" height="3.2" rx="0.6" fill="#55ACEE"/>

  <!-- 屋根のスマートなハイライト曲線 -->
  <path d="M 38 17.5 Q 55 18.5 85 26.5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>