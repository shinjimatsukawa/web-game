<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <defs>
    <style>
      .outline { stroke: #231f20; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin-line { stroke: #231f20; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 車体下部の青いスカート（帯） -->
  <path d="M 7 42 C 6 45 8 50 16 53 C 24 56 36 54 44 49 L 95 28 L 94 25 L 43 45 C 33 49 18 51 10 47 C 7 45 6 43 7 42 Z" 
        fill="#1d4ed8" stroke="#231f20" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 車体下のダークグレー影 -->
  <path d="M 40 48 L 54 43 L 44 47 Z" fill="#475569"/>

  <!-- 新幹線のメイン車体（ホワイト） -->
  <path d="M 6 41 C 5 36 8 30 19 25 C 27 21 34 16 43 16 C 53 16 75 25 96 27 L 7 42 Z" 
        fill="#ffffff"/>
  <!-- 車体全体のアウトライン -->
  <path d="M 6 41 C 5 36 8 30 19 25 C 27 21 34 16 43 16 C 53 16 75 25 96 27 L 43 45 C 33 49 18 51 10 47 C 7 45 6 43 6 41 Z" 
        fill="none" class="outline"/>

  <!-- 黄色のストライプ帯（青帯のすぐ上） -->
  <path d="M 7 42 C 15 47 30 46 43 42 L 95 25 L 95 27 L 43 44 C 30 48 15 49 7 44 Z" 
        fill="#facc15" stroke="#231f20" stroke-width="1.2"/>

  <!-- ノーズ先端の丸いキャップ（先頭ノーズライン） -->
  <path d="M 8 33 C 6 36 6 40 8 43 C 14 47 24 45 25 39 C 26 33 16 30 8 33 Z" 
        fill="#ffffff" class="thin-line"/>

  <!-- 運転席フロントガラス（水色・黒枠） -->
  <path d="M 23 25 C 28 20 38 21 42 22 C 43 25 41 30 38 31 C 28 32 23 30 23 25 Z" 
        fill="#c7e6fc" class="thin-line"/>
  <!-- フロントガラスの光沢反射ライン -->
  <path d="M 26 25 Q 32 23 38 24" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 楕円形の黄色いヘッドライト -->
  <ellipse cx="33" cy="35" rx="4.2" ry="3.2" fill="#fef08a" class="thin-line"/>
  <!-- ライト内部のライン -->
  <ellipse cx="33" cy="35" rx="2.4" ry="1.6" fill="#facc15"/>

  <!-- ドア（乗務員室ドア） -->
  <path d="M 49 22 L 57 23 L 53 40 L 45 38 Z" fill="#ffffff" class="thin-line"/>
  <rect x="50.5" y="25" width="4.5" height="6.5" rx="1" fill="#c7e6fc" class="thin-line"/>

  <!-- 客席の四角い窓（奥へ遠近感で小さくなる並び） -->
  <!-- 窓1 -->
  <path d="M 60 23.5 L 67 24.5 L 65 37 L 58 35.5 Z" fill="#c7e6fc" class="thin-line"/>
  <!-- 窓2 -->
  <path d="M 69 25 L 75 26 L 73 35 L 68 34 Z" fill="#c7e6fc" class="thin-line"/>
  <!-- 窓3 -->
  <path d="M 77 26 L 82 26.8 L 81 33.5 L 76 33 Z" fill="#c7e6fc" class="thin-line"/>
  <!-- 窓4 -->
  <path d="M 84 27 L 88 27.5 L 87 32.5 L 83 32 Z" fill="#c7e6fc" class="thin-line"/>
  <!-- 窓5 -->
  <path d="M 89.5 27.7 L 93 28.2 L 92.5 31.5 L 89 31.2 Z" fill="#c7e6fc" class="thin-line"/>

  <!-- 屋根のハイライト曲線 -->
  <path d="M 38 18 Q 55 19 85 27" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>