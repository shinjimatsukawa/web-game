<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- 新幹線ボディのグラデーション（清潔感のあるホワイト〜パールグレー） -->
    <linearGradient id="shinkansenWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shinkansenBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- スピード線（ビュンビュン走る演出） -->
  <line x1="2" y1="18" x2="6" y2="18" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="24" x2="5" y2="24" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="18" x2="38" y2="18" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="24" x2="39" y2="24" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 線路レール（地面・正面パース） -->
  <line x1="0" y1="38" x2="40" y2="38" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="12,38 28,38 26,34 14,34" fill="#cbd5e1"/>
  <line x1="11" y1="38" x2="14" y2="34" stroke="#64748b" stroke-width="1.5"/>
  <line x1="29" y1="38" x2="26" y2="34" stroke="#64748b" stroke-width="1.5"/>

  <!-- スカート（排障器・車体下部） -->
  <path d="M11 32 L13 36 H27 L29 32 Z" fill="#64748b"/>

  <!-- 新幹線車体（正面・ロングノーズフォルム） -->
  <path d="M14 6 C17 5 23 5 26 6 C29 8 32 14 32 24 C32 31 29 34 27 34 H13 C11 34 8 31 8 24 C8 14 11 8 14 6 Z" 
        fill="url(#shinkansenWhite)" stroke="#94a3b8" stroke-width="1"/>

  <!-- 新幹線の青いシンボルライン（フロントから側面へ流れるブルー帯） -->
  <path d="M9.5 25 C13 27 27 27 30.5 25 L30.8 28 C26 30 14 30 9.2 28 Z" fill="url(#shinkansenBlue)"/>
  <path d="M11 30 C15 31.5 25 31.5 29 30 L28.5 32 C24 33 16 33 11.5 32 Z" fill="url(#shinkansenBlue)"/>

  <!-- 運転席フロントガラス（上部・ブラック＆スカイブルー） -->
  <path d="M14 10 C16 9.5 24 9.5 26 10 C27.5 12 28 15 28 16 C25 17 15 17 12 16 C12 15 12.5 12 14 10 Z" 
        fill="#1e293b"/>
  <!-- フロントガラスの反射ハイライト -->
  <path d="M15 11 Q20 10.5 25 11 L24.5 13 Q20 12.5 15.5 13 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- ノーズ中央のエンブレム・ノーズライン -->
  <line x1="20" y1="17" x2="20" y2="23" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round"/>

  <!-- 左右のヘッドライト（ピカーッと光る黄色い目） -->
  <ellipse cx="14" cy="22" rx="2.5" ry="1.8" fill="#facc15" stroke="#eab308" stroke-width="0.5"/>
  <circle cx="13.5" cy="21.5" r="0.8" fill="#ffffff"/>
  <ellipse cx="26" cy="22" rx="2.5" ry="1.8" fill="#facc15" stroke="#eab308" stroke-width="0.5"/>
  <circle cx="25.5" cy="21.5" r="0.8" fill="#ffffff"/>

  <!-- 屋根の架線集電器（パンタグラフカバー） -->
  <rect x="18" y="3" width="4" height="3" rx="1" fill="#3b82f6"/>
</svg>