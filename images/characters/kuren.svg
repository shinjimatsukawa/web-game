<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <defs>
    <!-- 工事車両のイエローグラデーション -->
    <linearGradient id="craneYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="boomMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- 地面 -->
  <line x1="2" y1="40" x2="42" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 車輪・タイヤ（大きな工事用タイヤ） -->
  <!-- 前輪 -->
  <circle cx="34" cy="35" r="4.5" fill="#1e293b"/>
  <circle cx="34" cy="35" r="2.2" fill="#94a3b8"/>
  <circle cx="34" cy="35" r="0.8" fill="#475569"/>
  <!-- 中輪 -->
  <circle cx="21" cy="35" r="4.5" fill="#1e293b"/>
  <circle cx="21" cy="35" r="2.2" fill="#94a3b8"/>
  <circle cx="21" cy="35" r="0.8" fill="#475569"/>
  <!-- 後輪 -->
  <circle cx="10" cy="35" r="4.5" fill="#1e293b"/>
  <circle cx="10" cy="35" r="2.2" fill="#94a3b8"/>
  <circle cx="10" cy="35" r="0.8" fill="#475569"/>

  <!-- シャーシ（車体下部フレーム） -->
  <rect x="5" y="30" width="34" height="4" rx="1.5" fill="#334155"/>

  <!-- 運転席キャビン（前方・右側） -->
  <path d="M28 20 H36 Q40 20 40 24 L40 31 H28 Z" fill="url(#craneYellow)" stroke="#ca8a04" stroke-width="0.8"/>
  <!-- フロントガラス & サイドウィンドウ -->
  <path d="M31 22 H36 Q38.5 22 38.5 25 L38.5 27 H31 Z" fill="#38bdf8" opacity="0.9"/>
  <rect x="38" y="28" width="2" height="1.5" rx="0.5" fill="#ef4444"/> <!-- ヘッドライト -->

  <!-- 旋回台・クレーン操縦室（中央〜後部） -->
  <rect x="12" y="21" width="14" height="10" rx="2" fill="url(#craneYellow)" stroke="#ca8a04" stroke-width="0.8"/>
  <rect x="18" y="23" width="5" height="5" rx="1" fill="#38bdf8"/> <!-- オペレーター窓 -->

  <!-- クレーン旋回軸のギア -->
  <circle cx="14" cy="22" r="3.5" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>

  <!-- クレーンアーム（ブーム・斜め上に力強く伸びる） -->
  <g transform="rotate(-38 14 22)">
    <rect x="14" y="19" width="32" height="5.5" rx="1.5" fill="url(#boomMetal)" stroke="#a16207" stroke-width="0.8"/>
    <!-- トラス模様・伸縮シリンダー -->
    <line x1="20" y1="19" x2="24" y2="24.5" stroke="#a16207" stroke-width="0.8"/>
    <line x1="24" y1="19" x2="28" y2="24.5" stroke="#a16207" stroke-width="0.8"/>
    <line x1="28" y1="19" x2="32" y2="24.5" stroke="#a16207" stroke-width="0.8"/>
    <line x1="32" y1="19" x2="36" y2="24.5" stroke="#a16207" stroke-width="0.8"/>
    <!-- 先端プーリー（滑車） -->
    <circle cx="45" cy="21.75" r="2" fill="#334155"/>
  </g>

  <!-- クレーンの先端から垂れ下がるワイヤーとフック -->
  <!-- 先端座標: およそ x=38, y=5 付近 -->
  <line x1="39" y1="5" x2="39" y2="18" stroke="#334155" stroke-width="1"/>
  <!-- フック（かぎ爪） -->
  <path d="M38 18 H40 L40 21 Q40 24 37.5 24 Q35 24 35 21.5" stroke="#1e293b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 吊り上げられた荷物（木箱） -->
  <rect x="33" y="24" width="7" height="6" rx="0.5" fill="#b45309" stroke="#78350f" stroke-width="0.6"/>
  <line x1="33" y1="24" x2="40" y2="30" stroke="#78350f" stroke-width="0.5"/>
  <line x1="40" y1="24" x2="33" y2="30" stroke="#78350f" stroke-width="0.5"/>
</svg>