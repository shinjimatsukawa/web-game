<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bunny-outline {
        stroke: #2d1e18;
        stroke-width: 3.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bunny-thin {
        stroke: #2d1e18;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- 奥の耳（左耳・頭の後ろからピョコッと出ている） -->
  <path d="M 33 26 C 29 16 34 8 41 8 C 47 8 49 16 46 25 Z" 
        fill="#ffffff" class="bunny-outline"/>

  <!-- まあるい尻尾（右後ろ） -->
  <path d="M 86 78 C 94 77 97 86 91 88 C 86 90 82 84 85 78 Z" 
        fill="#ffffff" class="bunny-outline"/>

  <!-- うさぎの胴体・背中・お尻（ぽってり丸い雪見だいふくボディ） -->
  <path d="M 50 41 C 56 39 82 39 91 58 C 96 70 91 84 83 89 C 71 93 42 93 25 91 C 18 89 18 80 20 73 C 18 64 21 60 21 60" 
        fill="#ffffff" class="bunny-outline"/>

  <!-- 手前の耳（右耳・ピンクの内側が可愛い） -->
  <path d="M 36 32 C 34 20 40 13 47 14 C 54 15 56 22 51 34 C 47 43 43 41 36 32 Z" 
        fill="#ffffff" class="bunny-outline"/>
  <!-- 耳の内側のピンク -->
  <path d="M 40 27 C 39 21 42 17 46 17 C 49 18 52 23 49 28 C 46 34 43 33 40 27 Z" 
        fill="#fca5a5"/>

  <!-- 頭部・お顔の丸い輪郭（左向きのふっくら横顔） -->
  <path d="M 35 27 C 22 25 9 32 8 43 C 7 46 4 48 5 50 C 6 52 8 52 8 55 C 9 60 14 65 21 66 C 29 67 36 64 45 56 C 50 51 51 43 50 36 C 49 34 40 33 35 27 Z" 
        fill="#ffffff" class="bunny-outline"/>

  <!-- 鼻先のちっちゃなピンク -->
  <circle cx="5.2" cy="48" r="1.4" fill="#f472b6"/>

  <!-- つぶらな黒い瞳（楕円形） -->
  <ellipse cx="17" cy="45" rx="3.2" ry="3.8" fill="#2d1e18" transform="rotate(-5 17 45)"/>

  <!-- 首元のふんわりした影・毛並みアクセント -->
  <path d="M 20 63 Q 32 63 42 53" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- 首元の小さなドット（毛並み） -->
  <circle cx="22.5" cy="62" r="1.3" fill="#2d1e18"/>
  <circle cx="27" cy="60.5" r="1.3" fill="#2d1e18"/>

  <!-- 前足（ちょこんと折りたたんだ可愛い足） -->
  <path d="M 20 83 C 19 86 21 90 25 90 C 29 90 29 84 25 84 C 22 84 22 87 23 89" 
        fill="none" class="bunny-thin"/>
  <!-- 後ろ足（ももの丸みと足先） -->
  <path d="M 58 82 C 50 82 46 87 47 91" 
        fill="none" class="bunny-thin"/>
  <path d="M 52 87 C 49 90 54 91 58 91 C 66 91 69 87 68 84" 
        fill="none" class="bunny-thin"/>
  <circle cx="41.5" cy="89" r="1.3" fill="#2d1e18"/>
  <circle cx="73" cy="86" r="1.2" fill="#2d1e18"/>
  <circle cx="75.5" cy="84.5" r="1.2" fill="#2d1e18"/>
</svg>