<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .rabbit-outline {
        stroke: #2d1e18;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rabbit-detail {
        stroke: #2d1e18;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- 奥の耳（左耳） -->
  <path d="M 36 29 C 29 16 35 4 44 5 C 51 6 53 17 48 27 Z" 
        fill="#ffffff" class="rabbit-outline"/>

  <!-- まあるい尻尾（右後ろ） -->
  <path d="M 86 73 C 94 72 97 82 90 85 C 84 87 81 81 85 73 Z" 
        fill="#ffffff" class="rabbit-outline"/>

  <!-- うさぎの全体ボディ（もっちり丸い雪見だいふく体型） -->
  <path d="M 44 28 C 50 28 60 36 69 41 C 80 47 88 56 89 67 C 90 77 86 86 78 88 C 66 90 34 90 23 88 C 17 86 16 77 18 70 C 14 65 10 57 10 49 C 10 39 16 30 26 26 C 35 23 41 26 44 28 Z" 
        fill="#ffffff" class="rabbit-outline"/>

  <!-- 手前の耳（右耳・ピンクの内側） -->
  <path d="M 42 33 C 39 18 46 9 55 10 C 63 11 64 20 58 33 C 53 43 49 41 42 33 Z" 
        fill="#ffffff" class="rabbit-outline"/>
  <!-- 耳の内側の優しいピンク（Twemojiピンク #F4ABBA） -->
  <path d="M 46 27 C 44 19 48 14 53 15 C 57 16 58 22 55 29 C 52 34 49 33 46 27 Z" 
        fill="#f4abba"/>

  <!-- 首元のほんのりとした立体感シャドウ -->
  <path d="M 18 64 C 26 62 36 57 43 49" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 鼻先（ちっちゃなピンクのお鼻） -->
  <ellipse cx="9.5" cy="48" rx="1.6" ry="1.3" fill="#f4abba"/>
  <!-- ちっちゃな口元（ちょこんと丸い） -->
  <path d="M 9.5 49.5 C 9.5 51.5 8 52 7.5 51.5" fill="none" stroke="#2d1e18" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ほっぺのふんわりチーク（優しいピンク） -->
  <ellipse cx="20" cy="56" rx="5" ry="3.2" fill="#f4abba" opacity="0.6"/>

  <!-- クリッとした大きな黒目＋キラキラハイライト（愛らしい表情の決め手） -->
  <ellipse cx="23" cy="43" rx="4.8" ry="5.6" fill="#2d1e18"/>
  <circle cx="21.2" cy="41" r="2.0" fill="#ffffff"/>
  <circle cx="24.5" cy="45" r="1.0" fill="#ffffff"/>

  <!-- 前足（ちょこんと揃えた可愛い足） -->
  <path d="M 22 80 C 21 83 24 87 28 86 C 32 86 32 81 28 81" 
        fill="none" class="rabbit-detail"/>
  <path d="M 27 82 C 26 85 29 88 33 87 C 37 87 37 82 33 82" 
        fill="none" class="rabbit-detail"/>

  <!-- 後ろ足（ももの丸み） -->
  <path d="M 58 78 C 48 78 46 85 52 87 C 60 88 65 84 64 80" 
        fill="none" class="rabbit-detail"/>
</svg>