<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- まあるい尻尾（右後ろ） -->
  <circle cx="31.2" cy="26.8" r="2.8" fill="#CCD6DD"/>
  <circle cx="30.8" cy="26.4" r="2.6" fill="#FFFFFF"/>

  <!-- 奥の耳（左耳・陰影として少しグレー寄り） -->
  <path fill="#CCD6DD" d="M13 10 C10 4.5 11.8 0.8 15.2 1.2 C17.8 1.5 18.8 5.5 17 10 Z"/>

  <!-- ボディ下部・背面のベース（立体感を出すための柔らかな影レイヤー） -->
  <path fill="#E1E8ED" d="M15 10 C18 10 22 13 25 15 C29 17 32 20 32.5 24 C33 28 31 31 28 32 C23.5 32.5 12 32.5 7.5 32 C5.5 31.5 5 28 6 25.5 C4.5 24 3.2 21 3.2 18 C3.2 14 5.5 10.8 9.2 9.5 C12.2 8.5 14 9.5 15 10 Z"/>

  <!-- うさぎのメインボディ（手前の真っ白なおもちフォルム） -->
  <path fill="#FFFFFF" d="M15 10.5 C17.5 10.5 21.5 13.5 24.5 15.5 C28.2 17.5 31 20.5 31.5 24 C31.8 26.5 30.5 29 27.5 30 C23 30.5 12 30.5 8 30 C6.5 29.5 6 27 6.8 25 C5.6 23.5 4.2 20.8 4.2 18 C4.2 14.5 6.2 11.5 9.8 10.2 C12.5 9.2 14.2 10 15 10.5 Z"/>

  <!-- あご下のふんわり影（頭部と胴体の境目の立体感） -->
  <path fill="#CCD6DD" opacity="0.6" d="M 7.5 24.5 C 10 25.5 13 24 15 21 C 13.5 21.5 10.5 22.5 7.5 24.5 Z"/>

  <!-- 手前の耳（右耳・メインの白） -->
  <path fill="#FFFFFF" d="M15 11 C13.8 5.2 16.2 2.2 19.5 2.6 C22.2 3.0 22.8 6.5 20.8 11.2 C18.8 15 17.2 14.5 15 11 Z"/>
  <!-- 耳の内側の優しいピンク（Twemoji のウサギ耳ピンク #F4ABBA） -->
  <path fill="#F4ABBA" d="M16.5 9.5 C15.6 6.2 17.0 4.5 18.8 4.7 C20.3 4.9 20.6 7.2 19.6 9.8 C18.3 12 17.3 11.5 16.5 9.5 Z"/>

  <!-- ほっぺのふんわりチーク（ピンク #F4ABBA） -->
  <ellipse cx="7" cy="20" rx="2.0" ry="1.3" fill="#F4ABBA" opacity="0.75"/>

  <!-- クリッとした黒い瞳（Twemoji の黒 #292F33）とハイライト -->
  <ellipse cx="8" cy="15.5" rx="1.6" ry="1.9" fill="#292F33"/>
  <circle cx="7.4" cy="14.9" r="0.7" fill="#FFFFFF"/>
  <circle cx="8.6" cy="16.3" r="0.35" fill="#FFFFFF"/>

  <!-- 鼻先（ちっちゃなピンク #F4ABBA） -->
  <ellipse cx="3.4" cy="17.2" rx="0.7" ry="0.5" fill="#F4ABBA"/>

  <!-- 前足（ちょこんと揃えた可愛い前足） -->
  <ellipse cx="7.8" cy="30.2" rx="1.6" ry="1.0" fill="#CCD6DD"/>
  <ellipse cx="7.6" cy="29.9" rx="1.4" ry="0.8" fill="#FFFFFF"/>
  <ellipse cx="10.4" cy="30.5" rx="1.6" ry="1.0" fill="#CCD6DD"/>
  <ellipse cx="10.2" cy="30.2" rx="1.4" ry="0.8" fill="#FFFFFF"/>

  <!-- 後ろ足（ももの丸み・ふっくらした面） -->
  <path fill="#CCD6DD" opacity="0.7" d="M 20 27 C 18 28.5 19 30.5 22 30.5 C 24.5 30.5 26 29 25 27.5 C 23.5 26.5 21.5 26 20 27 Z"/>
  <ellipse cx="22.5" cy="29.5" rx="2.0" ry="1.0" fill="#FFFFFF"/>
</svg>