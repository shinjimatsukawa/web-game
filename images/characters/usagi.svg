<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .rabbit-line {
        stroke: #2b1d19;
        stroke-width: 3.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rabbit-thin {
        stroke: #2b1d19;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- 奥の耳（左耳） -->
  <path d="M 37 28 C 30 15 36 3 45 4 C 52 5 54 16 49 26 Z" 
        fill="#ffffff" class="rabbit-line"/>

  <!-- まあるい尻尾（右後ろ） -->
  <path d="M 86 73 C 94 72 97 82 90 85 C 84 87 81 81 85 73 Z" 
        fill="#ffffff" class="rabbit-line"/>

  <!-- うさぎの全体ボディ（もっちり丸いおもち体型） -->
  <path d="M 44 28 C 50 28 60 36 69 41 C 80 47 88 56 89 67 C 90 77 86 86 78 88 C 66 90 34 90 23 88 C 17 86 16 77 18 70 C 14 65 10 57 10 49 C 10 39 16 30 26 26 C 35 23 41 26 44 28 Z" 
        fill="#ffffff" class="rabbit-line"/>

  <!-- 手前の耳（右耳・ピンクの内側が可愛い） -->
  <path d="M 42 32 C 39 17 46 9 55 10 C 63 11 64 20 58 33 C 53 43 49 41 42 32 Z" 
        fill="#ffffff" class="rabbit-line"/>
  <!-- 耳の内側の優しいピンク -->
  <path d="M 46 27 C 44 19 48 14 53 15 C 57 16 58 22 55 29 C 52 34 49 33 46 27 Z" 
        fill="#fca5a5"/>

  <!-- 首元のほんのりとした淡い影（あご下の立体感） -->
  <path d="M 18 64 C 26 62 36 57 43 49" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 鼻先（ちっちゃなピンクのお鼻） -->
  <ellipse cx="9.5" cy="48" rx="1.5" ry="1.2" fill="#fb7185"/>
  <!-- ちっちゃな口元（ちょこんと丸い） -->
  <path d="M 9.5 49.5 C 9.5 51.5 8 52 7.5 51.5" fill="none" stroke="#2b1d19" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ほっぺのふんわりチーク（薄いピンク） -->
  <ellipse cx="20" cy="56" rx="4.5" ry="3" fill="#fecdd3" opacity="0.85"/>

  <!-- クリッとした大きな黒目＋キラキラハイライト -->
  <ellipse cx="23" cy="43" rx="4.8" ry="5.6" fill="#2b1d19"/>
  <circle cx="21.5" cy="41" r="2.0" fill="#ffffff"/>
  <circle cx="24.5" cy="45" r="1.0" fill="#ffffff"/>

  <!-- 前足（ちょこんと揃えた可愛い足） -->
  <path d="M 22 80 C 21 83 24 87 28 86 C 32 86 32 81 28 81" 
        fill="none" class="rabbit-thin"/>
  <path d="M 27 82 C 26 85 29 88 33 87 C 37 87 37 82 33 82" 
        fill="none" class="rabbit-thin"/>

  <!-- 後ろ足（ももの丸み） -->
  <path d="M 58 78 C 48 78 46 85 52 87 C 60 88 65 84 64 80" 
        fill="none" class="rabbit-thin"/>
</svg>