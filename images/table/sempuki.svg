<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- 涼しいブルーの扇風機グラデーション -->
    <linearGradient id="fanBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 涼しい風のエフェクト（左へ吹くウェーブ） -->
  <path d="M4 10 Q1 12 3 14" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M2 17 Q-1 19 2 21" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M4 25 Q1 27 3 29" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- 台座（ベース） -->
  <ellipse cx="23" cy="36" rx="12" ry="3.5" fill="url(#fanBody)" stroke="#0369a1" stroke-width="1.2"/>
  <ellipse cx="23" cy="35" rx="10" ry="2" fill="#e0f2fe" opacity="0.6"/>
  <!-- スイッチボタン -->
  <circle cx="19" cy="35" r="1.2" fill="#ef4444"/>
  <circle cx="23" cy="35.5" r="1.2" fill="#eab308"/>
  <circle cx="27" cy="35" r="1.2" fill="#22c55e"/>

  <!-- 支柱（ポール） -->
  <rect x="21" y="22" width="4" height="13" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

  <!-- 首振りジョイント部 -->
  <circle cx="23" cy="22" r="2.5" fill="#0284c7"/>

  <!-- 扇風機の外枠ファンガード（丸い大きなカゴ） -->
  <circle cx="23" cy="14" r="12" fill="#f0f9ff" stroke="url(#fanBody)" stroke-width="2.2"/>
  <circle cx="23" cy="14" r="11" fill="none" stroke="#bae6fd" stroke-width="0.8"/>

  <!-- ガードの格子ワイヤー（縦横放射線） -->
  <line x1="23" y1="2" x2="23" y2="26" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="11" y1="14" x2="35" y2="14" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="14.5" y1="5.5" x2="31.5" y2="22.5" stroke="#93c5fd" stroke-width="0.8"/>
  <line x1="14.5" y1="22.5" x2="31.5" y2="5.5" stroke="#93c5fd" stroke-width="0.8"/>

  <!-- 3枚の大きな回転羽根（プロペラ） -->
  <!-- 羽根1（上） -->
  <path d="M23 14 C21 9 20 4 24 3 C27 4 27 9 23 14 Z" fill="url(#fanBlade)" opacity="0.9"/>
  <!-- 羽根2（右下） -->
  <path d="M23 14 C27 15 32 18 31 22 C28 23 24 21 23 14 Z" fill="url(#fanBlade)" opacity="0.9"/>
  <!-- 羽根3（左下） -->
  <path d="M23 14 C19 16 15 20 14 17 C15 13 19 12 23 14 Z" fill="url(#fanBlade)" opacity="0.9"/>

  <!-- 中央のスピンキャップ -->
  <circle cx="23" cy="14" r="3.2" fill="#0284c7"/>
  <circle cx="22" cy="13" r="1" fill="#ffffff" opacity="0.8"/>
</svg>
