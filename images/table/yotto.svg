<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- 青い海グラデーション -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>

  <!-- 船体（ハル） -->
  <path d="M5 28 L35 28 L30 35 L10 35 Z" fill="#f72585" stroke="#b5179e" stroke-width="1.2"/>
  <line x1="8" y1="31" x2="32" y2="31" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- マスト（中央の柱） -->
  <line x1="20" y1="4" x2="20" y2="28" stroke="#4a4e69" stroke-width="2" stroke-linecap="round"/>

  <!-- メインセイル（右側の大きな白帆） -->
  <path d="M21 5 L35 25 L21 25 Z" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
  <!-- ジブセイル（左側の前帆・オレンジ） -->
  <path d="M19 8 L6 25 L19 25 Z" fill="#ffb703" stroke="#fb8500" stroke-width="1"/>

  <!-- マストのてっぺんの旗 -->
  <polygon points="20,4 25,6 20,8" fill="#e63946"/>

  <!-- 海の波 -->
  <path d="M2 35 Q6 33 10 35 Q14 37 18 35 Q22 33 26 35 Q30 37 34 35 Q38 33 40 35 L40 39 L2 39 Z" fill="url(#seaGrad)"/>
</svg>
