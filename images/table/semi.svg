<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- セミの透明な羽グラデーション -->
    <linearGradient id="cicadaWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cicadaBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="50%" stop-color="#582f0e"/>
      <stop offset="100%" stop-color="#331800"/>
    </linearGradient>
  </defs>

  <!-- 木の幹（背景） -->
  <path d="M4 0 L4 40 L12 40 L12 0 Z" fill="#7f4f24" opacity="0.35"/>
  <line x1="8" y1="5" x2="8" y2="35" stroke="#582f0e" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!-- セミの脚（左右6本） -->
  <g stroke="#331800" stroke-width="1.5" stroke-linecap="round" fill="none">
    <!-- 前脚 -->
    <path d="M16 14 L11 11 L10 8"/>
    <path d="M24 14 L29 11 L30 8"/>
    <!-- 中脚 -->
    <path d="M16 19 L10 20 L8 23"/>
    <path d="M24 19 L30 20 L32 23"/>
    <!-- 後脚 -->
    <path d="M17 24 L11 28 L10 33"/>
    <path d="M23 24 L29 28 L30 33"/>
  </g>

  <!-- セミの透明で大きな翅（はね） - 左右に折り重なる -->
  <!-- 左翅 -->
  <path d="M19 12 C13 14 7 24 11 36 C13 38 16 38 19 33 Z" 
        fill="url(#cicadaWing)" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M17 14 Q14 24 14 34 M17 19 Q12 25 15 28" stroke="#0284c7" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- 右翅 -->
  <path d="M21 12 C27 14 33 24 29 36 C27 38 24 38 21 33 Z" 
        fill="url(#cicadaWing)" stroke="#0284c7" stroke-width="1.2"/>
  <path d="M23 14 Q26 24 26 34 M23 19 Q28 25 25 28" stroke="#0284c7" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- セミの胴体 -->
  <!-- 腹部（縞模様） -->
  <ellipse cx="20" cy="22" rx="5" ry="9" fill="url(#cicadaBody)"/>
  <line x1="16" y1="18" x2="24" y2="18" stroke="#d4a373" stroke-width="1"/>
  <line x1="16" y1="21" x2="24" y2="21" stroke="#d4a373" stroke-width="1"/>
  <line x1="16.5" y1="24" x2="23.5" y2="24" stroke="#d4a373" stroke-width="1"/>
  <line x1="17.5" y1="27" x2="22.5" y2="27" stroke="#d4a373" stroke-width="1"/>

  <!-- 胸部（背中の甲板・緑がかったオリーブ色） -->
  <path d="M15 11 Q20 9 25 11 L24 16 Q20 17 16 16 Z" fill="#606c38" stroke="#283618" stroke-width="1"/>
  <path d="M18 11 Q20 14 22 11" stroke="#dda15e" stroke-width="1" fill="none"/>

  <!-- 頭部（幅広く平たい頭） -->
  <ellipse cx="20" cy="9.5" rx="5.5" ry="3" fill="#331800"/>

  <!-- 複眼（左右に大きく離れて突き出た目・赤褐色〜黒） -->
  <circle cx="14" cy="9" r="2.2" fill="#bc4749"/>
  <circle cx="13.5" cy="8.5" r="0.8" fill="#ffffff"/>
  <circle cx="26" cy="9" r="2.2" fill="#bc4749"/>
  <circle cx="25.5" cy="8.5" r="0.8" fill="#ffffff"/>

  <!-- 触角（小さく短い） -->
  <line x1="17" y1="7" x2="16" y2="4.5" stroke="#331800" stroke-width="1"/>
  <line x1="23" y1="7" x2="24" y2="4.5" stroke="#331800" stroke-width="1"/>
</svg>
