<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- 水滴と泡のグラデーション -->
    <linearGradient id="waterDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="soapBubble" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </radialGradient>
  </defs>

  <!-- 上部の蛇口から流れる水流 -->
  <path d="M18 0 H22 V5 Q22 8 20 8 Q18 8 18 5 Z" fill="#94a3b8"/>
  <path d="M18.5 7 L17.5 18 L22.5 18 L21.5 7 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- 水滴ピチャピチャ -->
  <path d="M15 12 Q13 14 13 16 A2 2 0 0 0 17 16 Q17 14 15 12 Z" fill="url(#waterDrop)"/>
  <path d="M25 11 Q23 13 23 15 A2 2 0 0 0 27 15 Q27 13 25 11 Z" fill="url(#waterDrop)"/>

  <!-- 手（両手をすり合わせて洗っている様子） -->
  <!-- 左手（親指と掌・指） -->
  <g transform="translate(11, 16) rotate(-15)">
    <!-- 掌 -->
    <path d="M4 14 C1 13 0 10 0 7 C0 3 3 1 7 1 C10 1 12 3 13 6 L12 16 Z" fill="#ffdfba"/>
    <!-- 指 -->
    <rect x="2" y="0" width="3" height="7" rx="1.5" fill="#ffd1a4"/>
    <rect x="6" y="-1" width="3" height="8" rx="1.5" fill="#ffdfba"/>
    <rect x="10" y="1" width="3" height="6" rx="1.5" fill="#ffd1a4"/>
    <!-- 親指 -->
    <path d="M0 6 C-2 5 -2 8 0 9 Z" fill="#ffdfba"/>
  </g>

  <!-- 右手（重ねてゴシゴシ洗う） -->
  <g transform="translate(21, 16) rotate(15)">
    <!-- 掌 -->
    <path d="M-1 14 C2 13 3 10 3 7 C3 3 0 1 -4 1 C-7 1 -9 3 -10 6 L-9 16 Z" fill="#ffd1a4"/>
    <!-- 指 -->
    <rect x="-5" y="0" width="3" height="7" rx="1.5" fill="#ffdfba"/>
    <rect x="-9" y="-1" width="3" height="8" rx="1.5" fill="#ffd1a4"/>
    <rect x="-13" y="1" width="3" height="6" rx="1.5" fill="#ffdfba"/>
  </g>

  <!-- もこもこの石けんの泡（ソープバブル） -->
  <!-- 中央の大きな泡のかたまり -->
  <circle cx="20" cy="22" r="5" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>
  <circle cx="15" cy="24" r="3.5" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>
  <circle cx="25" cy="24" r="3.8" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>
  <circle cx="20" cy="26" r="4.2" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>
  <circle cx="17" cy="19" r="2.8" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>
  <circle cx="23" cy="18" r="3.2" fill="url(#soapBubble)" stroke="#67e8f9" stroke-width="0.8"/>

  <!-- 飛び散る小さなシャボン玉 -->
  <circle cx="10" cy="26" r="2" fill="url(#soapBubble)" opacity="0.85"/>
  <circle cx="30" cy="25" r="2.2" fill="url(#soapBubble)" opacity="0.85"/>
  <circle cx="28" cy="17" r="1.5" fill="url(#soapBubble)" opacity="0.85"/>
  <circle cx="12" cy="17" r="1.6" fill="url(#soapBubble)" opacity="0.85"/>

  <!-- 泡の光沢（ハイライト） -->
  <ellipse cx="19" cy="21" rx="1.8" ry="1" fill="#ffffff" opacity="0.8" transform="rotate(-30 19 21)"/>
  <ellipse cx="24" cy="23" rx="1.2" ry="0.6" fill="#ffffff" opacity="0.8" transform="rotate(-30 24 23)"/>

  <!-- 清潔ピカピカのキラキラ光 -->
  <path d="M7 20 Q8 20 8 19 Q8 20 9 20 Q8 20 8 21 Q8 20 7 20 Z" fill="#38bdf8"/>
  <path d="M32 19 Q33.5 19 33.5 17.5 Q33.5 19 35 19 Q33.5 19 33.5 20.5 Q33.5 19 32 19 Z" fill="#38bdf8"/>
  <path d="M20 34 Q21 34 21 33 Q21 34 22 34 Q21 34 21 35 Q21 34 20 34 Z" fill="#38bdf8"/>
</svg>
