<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- 青・黄・赤のピカピカ発光グラデーション -->
    <radialGradient id="greenGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>

  <!-- 信号機の支柱（ポール） -->
  <rect x="18" y="22" width="4" height="18" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- 信号機の横型ボディ（黒/ダークグレーの角丸長方形） -->
  <rect x="2" y="8" width="36" height="15" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- 各ランプの上の庇（ひさし・フード） -->
  <path d="M5 8 C5 5 11 5 11 8 Z" fill="#334155"/>
  <path d="M17 8 C17 5 23 5 23 8 Z" fill="#334155"/>
  <path d="M29 8 C29 5 35 5 35 8 Z" fill="#334155"/>

  <!-- ★ 3色の信号ランプ（左から青・黄・赤） -->
  <!-- 1. 青信号（緑） -->
  <circle cx="8" cy="15.5" r="4.5" fill="url(#greenGlow)" stroke="#14532d" stroke-width="0.8"/>
  <ellipse cx="6.8" cy="14" rx="1.5" ry="0.8" fill="#ffffff" opacity="0.75" transform="rotate(-30 6.8 14)"/>

  <!-- 2. 黄信号（黄色） -->
  <circle cx="20" cy="15.5" r="4.5" fill="url(#yellowGlow)" stroke="#713f12" stroke-width="0.8"/>
  <ellipse cx="18.8" cy="14" rx="1.5" ry="0.8" fill="#ffffff" opacity="0.75" transform="rotate(-30 18.8 14)"/>

  <!-- 3. 赤信号（赤） -->
  <circle cx="32" cy="15.5" r="4.5" fill="url(#redGlow)" stroke="#7f1d1d" stroke-width="0.8"/>
  <ellipse cx="30.8" cy="14" rx="1.5" ry="0.8" fill="#ffffff" opacity="0.75" transform="rotate(-30 30.8 14)"/>

  <!-- ピカピカ光るアクセント（青信号のきらめき） -->
  <path d="M2 11 Q4 11 4 9 Q4 11 6 11 Q4 11 4 13 Q4 11 2 11 Z" fill="#4ade80"/>
</svg>
