<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- うさぎの毛並みグラデーション -->
    <linearGradient id="bunnyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- 草原の地面（足元） -->
  <path d="M2 36 Q10 33 20 35 Q30 37 38 34 L38 39 L2 39 Z" fill="#86efac" opacity="0.6"/>

  <!-- まあるい尻尾（左後ろ） -->
  <circle cx="6" cy="27" r="3.2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- うさぎの後ろ足（横座り・力強いもも） -->
  <ellipse cx="14" cy="29" rx="6" ry="4.5" fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1.2"/>
  <ellipse cx="15" cy="33.5" rx="4.5" ry="2" fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- うさぎの胴体（ぽってり丸い横向きボディ） -->
  <path d="M10 28 C8 21 12 16 20 18 C26 20 28 26 26 31 C23 34 13 34 10 28 Z" 
        fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 前足（ちょこんと前に出している） -->
  <ellipse cx="26" cy="32" rx="2.5" ry="4" fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1" transform="rotate(-15 26 32)"/>

  <!-- 耳（長い2本のピンと立ったお耳・ピンクの内側） -->
  <!-- 左耳（奥） -->
  <path d="M23 15 C21 8 20 1 23 0 C25 0 27 7 26 14 Z" fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M23 13 C22.5 8 22 2 23.5 1.5 C24.5 1.5 25.5 7 25 12 Z" fill="#fbcfe8"/>
  <!-- 右耳（手前） -->
  <path d="M26 16 C26 8 27 2 30 1.5 C32 1.5 32 8 30 16 Z" fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1.2"/>
  <path d="M27 14 C27 8 28 3.5 30 3 C31 3 31.5 8 30 14 Z" fill="#f472b6"/>

  <!-- 頭部（横向きの丸い輪郭・マズルが右向き） -->
  <path d="M20 20 C18 14 22 11 27 12 C32 13 36 17 36 21 C36 25 32 27 27 26 C22 26 20 24 20 20 Z" 
        fill="url(#bunnyWhite)" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- くりっとした赤い目（うさぎ特有のつぶらな瞳） -->
  <circle cx="29" cy="18" r="2.2" fill="#ef4444"/>
  <circle cx="28.3" cy="17.3" r="0.8" fill="#ffffff"/>

  <!-- ほっぺのチーク（ほんのりピンク） -->
  <ellipse cx="27" cy="22" rx="2.5" ry="1.5" fill="#fbcfe8" opacity="0.8"/>

  <!-- 鼻先（ピンクの小さな三角）と口元 -->
  <polygon points="35.5,21 37,21 36.2,22.2" fill="#f43f5e"/>
  <path d="M35 22.5 Q36 23.5 37 22.5" stroke="#94a3b8" stroke-width="0.8" fill="none"/>

  <!-- ひげ（右側にちょんちょんと2本） -->
  <line x1="33" y1="21.5" x2="38" y2="20.5" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="33" y1="23" x2="38" y2="24" stroke="#cbd5e1" stroke-width="0.8" stroke-linecap="round"/>
</svg>
