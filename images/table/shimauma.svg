<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <!-- シマウマの耳内側ピンク -->
  </defs>

  <!-- 頭部ベース（白い顔輪郭） -->
  <path d="M12 28 C9 24 8 18 10 13 C12 7 18 5 24 6 C28 7 30 11 31 16 C32 23 29 29 24 33 C20 36 15 35 12 28 Z" fill="#ffffff" stroke="#292f33" stroke-width="1.5"/>

  <!-- 耳（左耳・右耳） -->
  <!-- 左耳 -->
  <path d="M12 9 C9 4 11 1 14 3 C16 5 15 8 13 10 Z" fill="#ffffff" stroke="#292f33" stroke-width="1.5"/>
  <path d="M12.5 7.5 C11 5 12 3 13.5 4 C14.5 5 14 7 13 8 Z" fill="#ffb3c6"/>
  <!-- 右耳 -->
  <path d="M22 6 C23 1 26 1 27 4 C28 7 26 9 24 8 Z" fill="#ffffff" stroke="#292f33" stroke-width="1.5"/>
  <path d="M23.5 5.5 C24 3 25.5 3 26 4.5 C26.5 6 25.5 7 24.5 7 Z" fill="#ffb3c6"/>

  <!-- たてがみ（モヒカン状の白黒） -->
  <path d="M17 3 L19 0 L21 3 L23 1 L24 4" stroke="#292f33" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ★ シマウマの黒いシマ模様（顔と首のストライプ） -->
  <!-- 額の縞 -->
  <path d="M17 7 Q19 12 18 14" stroke="#292f33" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- 頬の縞（左） -->
  <path d="M10 16 Q14 17 17 18" stroke="#292f33" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M11 21 Q14 22 17 23" stroke="#292f33" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 頬の縞（右） -->
  <path d="M29 14 Q26 16 23 16" stroke="#292f33" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M28 19 Q25 21 22 21" stroke="#292f33" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 首・あご下の縞 -->
  <path d="M26 25 Q23 26 21 27" stroke="#292f33" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M24 30 Q22 31 19 32" stroke="#292f33" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 目（くりくりした黒目とハイライト） -->
  <!-- 左目 -->
  <circle cx="16" cy="15" r="2.2" fill="#292f33"/>
  <circle cx="15.3" cy="14.3" r="0.8" fill="#ffffff"/>
  <!-- 右目 -->
  <circle cx="24" cy="13.5" r="2.2" fill="#292f33"/>
  <circle cx="23.3" cy="12.8" r="0.8" fill="#ffffff"/>

  <!-- 鼻先・口（グレー〜黒のマズル） -->
  <path d="M12 28 C13 31 15 34 18 34 C21 34 23 32 23 29 C20 28 15 27 12 28 Z" fill="#66757f"/>
  <ellipse cx="15" cy="31" rx="1" ry="1.4" fill="#292f33"/>
  <ellipse cx="19" cy="31" rx="1" ry="1.4" fill="#292f33"/>
</svg>
