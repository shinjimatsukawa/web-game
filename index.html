<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPad Safari 最適化: ピンチズーム無効化、全画面アプリ化、セーフエリア対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="もじあそび パーク">
  <meta name="theme-color" content="#fff8f0">
  <base href="/">
  <title>もじあそび パーク - 4さいの ひらがな・カタカナ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 背景の浮遊デコレーション -->
  <div class="bg-decorations" aria-hidden="true">
    <span class="decor d1">🎈</span>
    <span class="decor d2">⭐</span>
    <span class="decor d3">🌈</span>
    <span class="decor d4">🌸</span>
  </div>

  <div id="app-container">
    <!-- ヘッダー（ナビゲーション ＆ BGM ＆ モード切り替え） -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-back-home" class="btn-circle-home hidden" aria-label="ホームへもどる">
          🏠
        </button>
      </div>

      <h1 id="header-title" class="header-title">🌟 もじあそび パーク 🌟</h1>

      <div class="header-right">
        <!-- BGM ON/OFF ボタン -->
        <button id="btn-bgm-toggle" class="btn-bgm" aria-label="BGMのオン・オフ">
          🎵 BGM: OFF
        </button>

        <!-- ひらがな / カタカナ 切り替え -->
        <div class="mode-toggle">
          <button id="btn-mode-hira" class="btn-toggle active">あ</button>
          <button id="btn-mode-kata" class="btn-toggle">ア</button>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="app-main">
      <!-- 画面①: トップページ（楽しいゲーム選択画面） -->
      <section id="screen-home" class="screen-view active">
        <div class="home-hero">
          <div class="hero-character-group">
            <span class="hero-char c1">🐷</span>
            <span class="hero-char c2">🐶</span>
            <span class="hero-char c3">🚗</span>
          </div>
          <h2 class="home-title">すきな あそびを えらんでね！</h2>
        </div>

        <div class="game-select-grid">
          <!-- ゲーム1: うごく！もじあつめ -->
          <button id="card-game-bubble" class="game-select-card card-pink">
            <div class="card-badge">100しゅるい！</div>
            <div class="card-hero-emoji">🦖</div>
            <div class="card-title">うごく！もじあつめ<br>きょうりゅう・くるま</div>
            <div class="card-desc">恐竜や 消防車が大集合！<br>シャボン玉を タッチしよう！</div>
          </button>

          <!-- ゲーム2: おしゃべり 50おんずかん -->
          <button id="card-game-board" class="game-select-card card-yellow">
            <div class="card-badge">おしゃべり</div>
            <div class="card-hero-emoji">📖</div>
            <div class="card-title">おしゃべり<br>50おんずかん</div>
            <div class="card-desc">アイスや いぬを タッチすると<br>元気に おしゃべりするよ！</div>
          </button>

          <!-- ゲーム3: ほりだせ！きょうりゅう かせきハント -->
          <button id="card-game-fossil" class="game-select-card card-orange">
            <div class="card-badge">新とうじょう！</div>
            <div class="card-hero-emoji">⛏️</div>
            <div class="card-title">ほりだせ！恐竜<br>かせきハント</div>
            <div class="card-desc">岩をトントン叩いて発掘！<br>文字をあつめて恐竜復活！</div>
          </button>
        </div>
      </section>

      <!-- 画面②: うごく！文字あつめゲーム -->
      <section id="screen-bubble" class="screen-view hidden">
        <div id="bubble-game-content" class="game-content-wrap"></div>
      </section>

      <!-- 画面③: 50音おしゃべり図鑑ゲーム -->
      <section id="screen-board" class="screen-view hidden">
        <div id="board-game-content" class="game-content-wrap"></div>
      </section>

      <!-- 画面④: ほりだせ！恐竜かせきハント -->
      <section id="screen-fossil" class="screen-view hidden">
        <div id="fossil-game-content" class="game-content-wrap"></div>
      </section>
    </main>
  </div>

  <!-- 紙吹雪・星パーティクル Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas" pointer-events="none"></canvas>

  <!-- スクリプト群 -->
  <script src="/js/data.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/game-bubble.js"></script>
  <script src="/js/game-board.js"></script>
  <script src="/js/game-fossil.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
