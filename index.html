<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPad Safari 最適化: ピンチズーム無効化、全画面アプリ化、セーフエリア対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="もじあそび パーク">
  <meta name="theme-color" content="#fff8f0">
  <base href="/">
  <title>もじあそび パーク - 4さいの ひらがな・カタカナ</title>
  <!-- ファビコン・アプリアイコン設定 -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css?v=25">
</head>
<body>
  <!-- 背景の浮遊デコレーション -->
  <div class="bg-decorations" aria-hidden="true">
    <span class="decor d1">🎈</span>
    <span class="decor d2">⭐</span>
    <span class="decor d3">🌈</span>
    <span class="decor d4">🌸</span>
  </div>

  <div id="app-container">
    <!-- ヘッダー（ナビゲーション ＆ BGM ＆ モード切り替え） -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-back-home" class="btn-circle-home hidden" aria-label="ホームへもどる">
          🏠
        </button>
      </div>

      <h1 id="header-title" class="header-title">🌟 もじあそび パーク 🌟</h1>

      <div class="header-right">
        <!-- レベル（難易度）切り替え -->
        <div class="diff-toggle" id="header-diff-toggle" role="group" aria-label="レベル選択">
          <button id="btn-diff-easy" class="btn-diff" data-diff="easy" title="かんたん (0もじ)">🐣<span class="diff-text"> かんたん</span></button>
          <button id="btn-diff-normal" class="btn-diff active" data-diff="normal" title="ふつう (1〜2もじ)">🐰<span class="diff-text"> ふつう</span></button>
          <button id="btn-diff-hard" class="btn-diff" data-diff="hard" title="むずかしい (3〜4もじ)">🦁<span class="diff-text"> むずかしい</span></button>
        </div>

        <!-- ひらがな / カタカナ 切り替え -->
        <div class="mode-toggle">
          <button id="btn-mode-hira" class="btn-toggle active">あ</button>
          <button id="btn-mode-kata" class="btn-toggle">ア</button>
        </div>

        <!-- BGM ON/OFF ボタン -->
        <button id="btn-bgm-toggle" class="btn-bgm" aria-label="BGMのオン・オフ">
          🎵 BGM: OFF
        </button>
      </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="app-main">
      <!-- 画面①: トップページ（楽しいゲーム選択画面） -->
      <section id="screen-home" class="screen-view active">
        <div class="home-hero">
          <div class="hero-character-group">
            <span class="hero-char c1">🐷</span>
            <span class="hero-char c2">🐶</span>
            <span class="hero-char c3">🚗</span>
          </div>
          <h2 class="home-title">すきな あそびを えらんでね！</h2>
        </div>

        <div class="game-select-grid">
          <!-- ゲーム1: うごく！もじあつめ -->
          <button id="card-game-bubble" class="game-select-card card-pink">
            <div class="card-badge">75しゅるい！</div>
            <div class="card-hero-emoji">🚒</div>
            <div class="card-title">うごく！もじあつめ<br>くるま・どうぶつ</div>
            <div class="card-desc">しょうぼうしゃや 動物が大集合！<br>シャボン玉を タッチしよう！</div>
          </button>

          <!-- ゲーム2: おしゃべり 50おんずかん -->
          <button id="card-game-board" class="game-select-card card-yellow">
            <div class="card-badge">おしゃべり</div>
            <div class="card-hero-emoji">📖</div>
            <div class="card-title">おしゃべり<br>50おんずかん</div>
            <div class="card-desc">アイスや いぬを タッチすると<br>元気に おしゃべりするよ！</div>
          </button>
        </div>

        <div style="text-align: center; margin-top: 28px; opacity: 0.7;">
          <a href="review.html" style="color: #666; font-size: 0.85rem; text-decoration: none; border-bottom: 1px dashed #aaa; padding-bottom: 2px;">
            🔍 文字集め問題・画像・問題文レビュー
          </a>
        </div>
      </section>

      <!-- 画面②: うごく！文字あつめゲーム -->
      <section id="screen-bubble" class="screen-view hidden">
        <div id="bubble-game-content" class="game-content-wrap"></div>
      </section>

      <!-- 画面③: 50音おしゃべり図鑑ゲーム -->
      <section id="screen-board" class="screen-view hidden">
        <div id="board-game-content" class="game-content-wrap"></div>
      </section>
    </main>
  </div>

  <!-- 紙吹雪・星パーティクル Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas" pointer-events="none"></canvas>

  <!-- スクリプト群 -->
  <script src="/js/data.js?v=25"></script>
  <script src="/js/audio.js?v=25"></script>
  <script src="/js/game-bubble.js?v=25"></script>
  <script src="/js/game-board.js?v=25"></script>
  <script src="/js/app.js?v=25"></script>
</body>
</html>
