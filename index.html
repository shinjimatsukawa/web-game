<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPad Safari 最適化: ピンチズーム無効化、全画面アプリ化、セーフエリア対応 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="うごく！もじあつめ">
  <meta name="theme-color" content="#fff5f5">
  <title>うごく！どうぶつ もじあつめ - 4さいの ひらがな・カタカナ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- ヘッダー（ナビゲーション ＆ モード切り替え） -->
    <header class="app-header">
      <div class="header-tabs">
        <button id="btn-tab-play" class="btn-tab active">🐷 あそぶ</button>
        <button id="btn-tab-collection" class="btn-tab">📖 なかまたち</button>
      </div>

      <div class="mode-toggle">
        <button id="btn-mode-hira" class="btn-toggle active">あ (ひらがな)</button>
        <button id="btn-mode-kata" class="btn-toggle">ア (カタカナ)</button>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="app-main">
      <!-- 画面①: ゲームプレイ画面（開いてすぐに遊べる！） -->
      <section id="screen-play" class="screen-view">
        <div id="play-content" class="game-stage-wrapper"></div>
      </section>

      <!-- 画面②: なかまたち図鑑画面 -->
      <section id="screen-collection" class="screen-view hidden">
        <div class="collection-title-box">
          <h2>🌟 なかまたち ずかん 🌟</h2>
          <p>すきな おともだちを タッチしてね！</p>
        </div>
        <div id="collection-content" class="collection-wrapper"></div>
      </section>
    </main>
  </div>

  <!-- 紙吹雪・星パーティクル Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas" pointer-events="none"></canvas>

  <!-- スクリプト群 -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game-bubble.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
